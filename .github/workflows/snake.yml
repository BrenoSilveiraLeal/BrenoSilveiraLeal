name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Generate purple snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BrenoSilveiraLeal
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%238B5CF6&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%23a78bfa,%238b5cf6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%23161B22,%233B0764,%236D28D9,%23A855F7,%23D8B4FE

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
